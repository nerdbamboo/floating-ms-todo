appId: com.floatingtodo.app
productName: Floating To Do
directories:
  output: dist
  buildResources: assets
files:
  - out/**/*
  - package.json
win:
  target:
    - nsis
    - portable
  # 서명서 없음 → 서명 도구(winCodeSign) 다운로드 생략 (관리자/심볼릭링크 권한 불필요)
  signAndEditExecutable: false
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: stevenCho <34876337+nerdbamboo@users.noreply.github.com>
  description: MS To Do floating app for Windows/Linux with LLM-friendly design
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
